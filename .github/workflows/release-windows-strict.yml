name: Release Windows strict Markdown

on:
  push:
    tags:
      - 'v*.*.*'
      - 'windows-strict-markdown-v*.*.*'

permissions:
  contents: write

concurrency:
  group: windows-strict-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lvasky/OpenTypo' || startsWith(github.ref_name, 'windows-strict-markdown-v')
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Keep source line endings for source-based tests
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate messages and check types
        run: |
          pnpm exec paraglide-js compile
          pnpm check

      - name: Run Markdown, table and settings regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pnpm exec vitest run `
            src/lib/editor-core/strictMarkdown.test.ts `
            src/lib/editor-core/clipboardContract.test.ts `
            src/lib/editor-core/InlineSourceCodec.test.ts `
            src/lib/editor-core/tableMarkdown.test.ts `
            src/lib/editor-core/tableCommands.test.ts `
            src/lib/editor-core/tableActions.test.ts `
            src/lib/table-layout/widths.test.ts `
            src/lib/editor-core/clipboardMarkdown.test.ts `
            src/lib/editor-core/markdown.test.ts `
            src/lib/editor-core/details.test.ts `
            src/lib/editor-core/inlineSourceIntegration.test.ts `
            src/lib/editor-core/nodeViews/TableNodeView.test.ts `
            src/lib/editor-core/plugins/tableHtml.test.ts `
            src/app/services/settings.test.ts `
            src/app/services/editorInteractionController.test.ts `
            src/app/services/imageInsertion.test.ts `
            src/app/services/clipboard.test.ts `
            --maxWorkers=4 --minWorkers=1 --reporter=default --reporter=json --outputFile=artifacts/tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -notin @("v$version", "windows-strict-markdown-v$version")) {
            throw "Release tag does not match OpenTypo version $version"
          }
          "OPENTYPO_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build native Windows installer
        run: pnpm build:win64:nsis

      - name: Package portable app and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $version = $env:OPENTYPO_RELEASE_VERSION
          Copy-Item $installers[0].FullName "artifacts/OpenTypo_${version}_x64-setup.exe"
          $app = Join-Path $env:RUNNER_TEMP 'OpenTypo-strict-markdown/OpenTypo'
          New-Item -ItemType Directory -Force "$app/samples/assets" | Out-Null
          Copy-Item "$release/nomo.exe" "$app/OpenTypo.exe"
          if (Test-Path "$release/WebView2Loader.dll") {
            Copy-Item "$release/WebView2Loader.dll" $app
          }
          Copy-Item sample.md "$app/samples/sample.md"
          Copy-Item assets/128x128.png "$app/samples/assets/128x128.png"
          Copy-Item LICENSE "$app/LICENSE"
          Compress-Archive -Path $app -DestinationPath "artifacts/OpenTypo_${version}_x64.zip"
          Get-FileHash artifacts/*.exe, artifacts/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          Get-FileHash artifacts/*.exe, artifacts/*.zip -Algorithm MD5 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content artifacts/checksums.md5 -Encoding utf8

      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = $env:OPENTYPO_RELEASE_VERSION
          $releaseFlags = @('--latest')
          if ($env:GITHUB_REF_NAME.StartsWith('windows-strict-markdown-v')) {
            $releaseFlags = @('--prerelease', '--latest=false')
          }
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/OpenTypo_${version}_x64-setup.exe" `
            "artifacts/OpenTypo_${version}_x64.zip" `
            artifacts/checksums.md5 `
            artifacts/SHA256SUMS.txt `
            --verify-tag @releaseFlags `
            --title "OpenTypo $version（Windows x64）" `
            --notes-file ".github/release-notes/v$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
